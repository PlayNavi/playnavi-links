<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayNaviを開く</title>
    <style>
        :root {
            --primary-color: #3DB2C5;
            --text-color: #333;
            --bg-color: #f5f7fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* 画面全体のラッパー（X対策を含む） */
        .page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            /* iOS Safariや一部アプリ内ブラウザでの表示崩れ防止 */
            min-height: -webkit-fill-available;
        }

        .container {
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center; /* ★修正：ここに追加（テキストを中央揃え） */
        }

        /* ロゴ画像（サイズ調整済み） */
        .logo-img {
            width: 180px;
            max-width: 80%;
            height: auto;
            margin-bottom: 32px;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--primary-color);
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px 0;
            color: var(--text-color);
        }

        p.description {
            font-size: 14px;
            color: #666;
            margin: 0 0 24px 0;
            line-height: 1.6;
        }

        /* ボタン */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background: linear-gradient(135deg, var(--primary-color), #2da0b3);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(61, 178, 197, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center; /* ★修正：ここにも念のため追加 */
        }
        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(61, 178, 197, 0.3);
        }
        .btn + .btn {
            margin-top: 12px;
        }
        .btn-secondary {
            background: #fff;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            box-shadow: none;
        }
        .store-buttons {
            width: 100%;
            display: none;
            flex-direction: column;
        }
        .store-buttons.is-visible {
            display: flex;
        }
        .hidden {
            display: none !important;
        }
    </style>
    <script>
        (function () {
            var APP_STORE_URL = "https://apps.apple.com/jp/app/playnavi/id6756201875";
            var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.playnavilab.playnavi.app";
            var LAUNCH_TIMEOUT_MS = 2000;

            function detectPlatform(ua) {
                if (/iPhone|iPad|iPod/i.test(ua)) return "ios";
                if (/Android/i.test(ua)) return "android";
                return "other";
            }

            window.addEventListener("load", function () {
                var path = window.location.pathname;
                var query = window.location.search;
                var schemeUrl = "playnavi:/" + path + query;

                var platform = detectPlatform(navigator.userAgent || "");
                var storeUrl = platform === "ios" ? APP_STORE_URL
                             : platform === "android" ? PLAY_STORE_URL
                             : null;

                var manualBtn = document.getElementById("manual-btn");
                if (manualBtn) manualBtn.href = schemeUrl;

                var storeButtons = document.getElementById("store-buttons");
                var spinner = document.getElementById("spinner");
                var heading = document.getElementById("heading");
                var description = document.getElementById("description");

                if (!storeUrl) {
                    // PC など: 自動遷移は抑止し、両ストアの導線を提示
                    if (spinner) spinner.classList.add("hidden");
                    if (heading) heading.textContent = "PlayNavi をインストール";
                    if (description) {
                        description.innerHTML = "スマートフォンで以下のリンクを開くと PlayNavi をダウンロードできます。";
                    }
                    if (manualBtn) manualBtn.classList.add("hidden");
                    var iosBtn = document.getElementById("ios-store-btn");
                    var androidBtn = document.getElementById("android-store-btn");
                    if (iosBtn) iosBtn.href = APP_STORE_URL;
                    if (androidBtn) androidBtn.href = PLAY_STORE_URL;
                    if (storeButtons) storeButtons.classList.add("is-visible");
                    return;
                }

                // モバイル: scheme 起動を試み、起動できなければストアへフォールバック
                var appLaunched = false;
                var markLaunched = function () { appLaunched = true; };
                document.addEventListener("visibilitychange", function () {
                    if (document.hidden) markLaunched();
                });
                window.addEventListener("pagehide", markLaunched);
                window.addEventListener("blur", markLaunched);

                window.location.href = schemeUrl;

                setTimeout(function () {
                    if (appLaunched) return;
                    // フォールバック表示 (タイムアウトより手動操作が早い場合に備える)
                    if (spinner) spinner.classList.add("hidden");
                    if (heading) heading.textContent = "アプリが見つかりません";
                    if (description) {
                        description.innerHTML = "アプリが起動しない場合は、ストアからインストールしてください。";
                    }
                    if (storeButtons) storeButtons.classList.add("is-visible");
                    window.location.href = storeUrl;
                }, LAUNCH_TIMEOUT_MS);
            });
        })();
    </script>
</head>
<body>
    <div class="page-wrapper">
        <div class="container">
            <img src="/logo.png" alt="PlayNavi Logo" class="logo-img">

            <div id="spinner" class="spinner"></div>

            <h1 id="heading">PlayNaviを起動しています...</h1>
            <p id="description" class="description">
                自動的にアプリが開かない場合は、<br>下のボタンをタップしてください。
            </p>

            <a href="#" id="manual-btn" class="btn">アプリで開く</a>

            <div id="store-buttons" class="store-buttons">
                <a id="ios-store-btn" href="https://apps.apple.com/jp/app/playnavi/id6756201875" class="btn">App Store からダウンロード</a>
                <a id="android-store-btn" href="https://play.google.com/store/apps/details?id=com.playnavilab.playnavi.app" class="btn btn-secondary">Google Play からダウンロード</a>
            </div>
        </div>
    </div>
</body>
</html>
