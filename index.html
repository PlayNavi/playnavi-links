<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayNaviを開く</title>
    <style>
        :root {
            --primary-color: #3DB2C5;
            --text-color: #333;
            --bg-color: #f5f7fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* 画面全体のラッパー（X対策を含む） */
        .page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            /* iOS Safariや一部アプリ内ブラウザでの表示崩れ防止 */
            min-height: -webkit-fill-available;
        }

        .container {
            background-color: #fff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* ロゴ画像（サイズ調整済み） */
        .logo-img {
            width: 180px;
            max-width: 80%;
            height: auto;
            margin-bottom: 32px;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: var(--primary-color);
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-size: 20px;
            margin: 0 0 12px 0;
            color: var(--text-color);
        }

        p.description {
            font-size: 14px;
            color: #666;
            margin: 0 0 24px 0;
            line-height: 1.6;
        }

        /* Primary action: ブランドカラーのグラデーション */
        .btn-primary {
            display: inline-block;
            width: 100%;
            padding: 14px 0;
            background: linear-gradient(135deg, var(--primary-color), #2da0b3);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(61, 178, 197, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
            text-align: center;
            box-sizing: border-box;
        }
        .btn-primary:active {
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(61, 178, 197, 0.3);
        }

        /* Store badge: 公式バッジ風 (黒背景 + ロゴ + テキスト) */
        .btn-store {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 12px 0;
            background: #000;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 15px;
            transition: transform 0.2s, opacity 0.2s;
            text-align: center;
            box-sizing: border-box;
        }
        .btn-store:active {
            transform: scale(0.98);
            opacity: 0.85;
        }
        .btn-store .icon {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
        }
        .btn-store .icon svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .btn-store .label {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            line-height: 1.1;
        }
        .btn-store .label small {
            font-size: 10px;
            font-weight: 400;
            opacity: 0.85;
            margin-bottom: 2px;
        }

        /* 区切り (見出し付きセパレータ) */
        .separator {
            display: none;
            align-items: center;
            width: 100%;
            margin: 20px 0 14px;
            font-size: 12px;
            color: #999;
        }
        .separator::before,
        .separator::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        .separator > span {
            padding: 0 10px;
            white-space: nowrap;
        }
        .separator.is-visible {
            display: flex;
        }

        /* ストアボタン群 */
        .store-buttons {
            width: 100%;
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .store-buttons.is-visible {
            display: flex;
        }

        .hidden {
            display: none !important;
        }
    </style>
    <script>
        (function () {
            var APP_STORE_URL = "https://apps.apple.com/jp/app/playnavi/id6756201875";
            var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.playnavilab.playnavi.app";
            var LAUNCH_TIMEOUT_MS = 2000;

            function detectPlatform(ua) {
                if (/iPhone|iPad|iPod/i.test(ua)) return "ios";
                if (/Android/i.test(ua)) return "android";
                return "other";
            }

            function showFallbackButtons(elements, platform) {
                if (elements.spinner) elements.spinner.classList.add("hidden");
                if (elements.iosBtn) elements.iosBtn.href = APP_STORE_URL;
                if (elements.androidBtn) elements.androidBtn.href = PLAY_STORE_URL;

                if (platform === "ios" && elements.androidBtn) {
                    elements.androidBtn.classList.add("hidden");
                } else if (platform === "android" && elements.iosBtn) {
                    elements.iosBtn.classList.add("hidden");
                }

                // PC では「アプリで開く」ボタンがないためセパレータは出さない
                if (platform !== "other" && elements.separator) {
                    elements.separator.classList.add("is-visible");
                }

                if (elements.storeButtons) elements.storeButtons.classList.add("is-visible");
            }

            window.addEventListener("load", function () {
                var path = window.location.pathname;
                var query = window.location.search;
                var schemeUrl = "playnavi:/" + path + query;

                var platform = detectPlatform(navigator.userAgent || "");
                var storeUrl = platform === "ios" ? APP_STORE_URL
                             : platform === "android" ? PLAY_STORE_URL
                             : null;

                var elements = {
                    manualBtn: document.getElementById("manual-btn"),
                    storeButtons: document.getElementById("store-buttons"),
                    iosBtn: document.getElementById("ios-store-btn"),
                    androidBtn: document.getElementById("android-store-btn"),
                    separator: document.getElementById("separator"),
                    spinner: document.getElementById("spinner"),
                    heading: document.getElementById("heading"),
                    description: document.getElementById("description")
                };

                if (elements.manualBtn) elements.manualBtn.href = schemeUrl;

                if (!storeUrl) {
                    // PC など: 自動遷移は抑止し、両ストアの導線を提示
                    if (elements.heading) elements.heading.textContent = "PlayNavi をインストール";
                    if (elements.description) {
                        elements.description.innerHTML = "スマートフォンで以下のリンクを開くと PlayNavi をダウンロードできます。";
                    }
                    if (elements.manualBtn) elements.manualBtn.classList.add("hidden");
                    showFallbackButtons(elements, "other");
                    return;
                }

                // モバイル: scheme 起動を試み、起動できなければストアへフォールバック
                var appLaunched = false;
                var markLaunched = function () { appLaunched = true; };
                document.addEventListener("visibilitychange", function () {
                    if (document.hidden) markLaunched();
                });
                window.addEventListener("pagehide", markLaunched);
                window.addEventListener("blur", markLaunched);

                window.location.href = schemeUrl;

                setTimeout(function () {
                    if (appLaunched) return;
                    if (elements.heading) elements.heading.textContent = "アプリが見つかりません";
                    if (elements.description) {
                        elements.description.innerHTML = "アプリが起動しない場合は、ストアからインストールしてください。";
                    }
                    showFallbackButtons(elements, platform);
                    window.location.href = storeUrl;
                }, LAUNCH_TIMEOUT_MS);
            });
        })();
    </script>
</head>
<body>
    <div class="page-wrapper">
        <div class="container">
            <img src="/logo.png" alt="PlayNavi Logo" class="logo-img">

            <div id="spinner" class="spinner"></div>

            <h1 id="heading">PlayNaviを起動しています...</h1>
            <p id="description" class="description">
                自動的にアプリが開かない場合は、<br>下のボタンをタップしてください。
            </p>

            <a href="#" id="manual-btn" class="btn-primary">アプリで開く</a>

            <div id="separator" class="separator"><span>アプリがインストールされてない場合</span></div>

            <div id="store-buttons" class="store-buttons">
                <a id="ios-store-btn" href="https://apps.apple.com/jp/app/playnavi/id6756201875" class="btn-store">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path fill="currentColor" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                        </svg>
                    </span>
                    <span class="label">
                        <small>Download on the</small>
                        <strong>App Store</strong>
                    </span>
                </a>
                <a id="android-store-btn" href="https://play.google.com/store/apps/details?id=com.playnavilab.playnavi.app" class="btn-store">
                    <span class="icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path fill="#EA4335" d="M3.609 1.814 13.792 12 3.609 22.186A.996.996 0 0 1 3 21.266V2.734a1 1 0 0 1 .609-.92Z"/>
                            <path fill="#FBBC04" d="m13.792 12 2.302 2.302-10.937 6.333L13.792 12Z"/>
                            <path fill="#34A853" d="m18.503 13.353-2.409 1.395L13.792 12l2.302-2.491 2.409 1.395a1 1 0 0 1 0 1.73Z"/>
                            <path fill="#4285F4" d="M5.864 2.658 16.802 8.99l-2.302 2.302L5.864 2.658Z"/>
                        </svg>
                    </span>
                    <span class="label">
                        <small>GET IT ON</small>
                        <strong>Google Play</strong>
                    </span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
