<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>PlayNavi</title>
    <link rel="stylesheet" href="/assets/site.css">
    <script type="module" src="/assets/app.mjs"></script>
  </head>
  <body>
    <main>
      <section id="link-view" class="card" aria-live="polite">
        <img class="logo" src="/logo.png" alt="PlayNavi">
        <div id="spinner" class="spinner"></div>
        <h1 id="heading">PlayNavi</h1>
        <p id="description">リンクを確認しています。</p>
        <div class="actions">
          <a id="primary-btn" class="button primary hidden" href="#">PlayNaviアプリで開く</a>
          <button id="retry-btn" class="button secondary hidden" type="button">もう一度試す</button>
        </div>
        <div id="store-buttons" class="stores hidden" aria-label="アプリストア">
          <a id="ios-store-btn" class="button store" href="https://apps.apple.com/jp/app/playnavi/id6756201875">App Storeで入手</a>
          <a id="android-store-btn" class="button store" href="https://play.google.com/store/apps/details?id=com.playnavilab.playnavi.app">Google Playで入手</a>
        </div>
      </section>

      <section id="survey-view" class="card survey-card hidden" aria-live="polite">
        <img class="logo survey-logo" src="/logo.png" alt="PlayNavi">
        <div id="survey-loading" class="spinner"></div>
        <h1 id="survey-title">アンケート</h1>
        <p id="survey-description">アンケートを準備しています。</p>

        <div id="survey-login" class="hidden">
          <ul class="login-notice">
            <li>アカウントに紐づく報酬をご提供するため、ログインをお願いします。</li>
            <li>回答内容は他のユーザーには公開されず、個人が分からない形で集計・利用します。</li>
            <li id="survey-guide" class="hidden"></li>
          </ul>
          <div class="actions oauth-actions">
            <a id="apple-login" class="button oauth apple" href="#">
              <img class="oauth-icon apple-icon" src="/assets/icons/apple.png" alt="" aria-hidden="true">
              <span>Appleでログイン</span>
            </a>
            <a id="google-login" class="button oauth google" href="#">
              <img class="oauth-icon google-icon" src="/assets/icons/google.png" alt="" aria-hidden="true">
              <span>Googleでログイン</span>
            </a>
            <button id="guest-login" class="button guest" type="button">報酬なしでログインせずに回答する</button>
          </div>
        </div>

        <form id="survey-form" class="survey-form hidden" novalidate>
          <div class="survey-progress" aria-live="polite">
            <div class="survey-progress-copy">
              <span id="survey-step">1 / 1</span>
              <span id="survey-progress-label">回答の進捗</span>
            </div>
            <div id="survey-progress-track" class="survey-progress-track" role="progressbar" aria-label="アンケートの回答進捗" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1">
              <span id="survey-progress-bar"></span>
            </div>
          </div>
          <div id="survey-questions"></div>
          <p id="survey-error" class="error hidden" role="alert"></p>
          <div class="survey-navigation">
            <button id="survey-back" class="button secondary" type="button">戻る</button>
            <button id="survey-next" class="button primary" type="button">次へ</button>
            <button id="survey-submit" class="button primary hidden" type="submit">回答を送信</button>
          </div>
        </form>

        <div id="survey-result" class="result hidden">
          <div id="result-icon" class="result-icon" aria-hidden="true">✓</div>
          <h2 id="result-heading">回答ありがとうございました</h2>
          <p id="result-description"></p>
          <div id="title-reward" class="reward hidden">
            <span class="reward-label">獲得した称号</span>
            <strong id="title-name"></strong>
          </div>
        </div>

        <button id="survey-retry" class="button secondary hidden" type="button">もう一度試す</button>
      </section>
    </main>
  </body>
</html>
