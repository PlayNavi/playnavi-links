<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PlayNavi</title>
    <style>
      :root { --primary: #3db2c5; --primary-dark: #2797aa; --text: #25313a; --muted: #66737d; }
      * { box-sizing: border-box; }
      body { margin: 0; color: var(--text); background: #f4f8fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
      .card { width: min(100%, 420px); padding: 40px 28px; border-radius: 22px; background: #fff; box-shadow: 0 12px 36px rgba(27, 76, 88, .10); text-align: center; }
      .logo { width: 180px; max-width: 75%; height: auto; margin: 0 auto 30px; }
      h1 { margin: 0 0 12px; font-size: 21px; line-height: 1.45; }
      p { min-height: 3.4em; margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.7; }
      .spinner { width: 34px; height: 34px; margin: 0 auto 20px; border: 4px solid #dce9ec; border-left-color: var(--primary); border-radius: 50%; animation: spin .9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .actions { display: grid; gap: 12px; }
      .button { display: flex; min-height: 48px; align-items: center; justify-content: center; padding: 12px 18px; border: 0; border-radius: 999px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
      .primary { color: #fff; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); box-shadow: 0 4px 12px rgba(61, 178, 197, .28); }
      .secondary { color: var(--primary-dark); background: #eaf7f9; }
      .stores { display: grid; gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px solid #e7ecef; }
      .store { color: #fff; background: #101214; border-radius: 12px; }
      .hidden { display: none !important; }
    </style>
    <script type="module" src="/assets/app.mjs"></script>
  </head>
  <body>
    <main>
      <section class="card" aria-live="polite">
        <img class="logo" src="/logo.png" alt="PlayNavi">
        <div id="spinner" class="spinner"></div>
        <h1 id="heading">PlayNavi</h1>
        <p id="description">リンクを確認しています。</p>
        <div class="actions">
          <a id="primary-btn" class="button primary hidden" href="#">PlayNaviアプリで開く</a>
          <button id="retry-btn" class="button secondary hidden" type="button">もう一度試す</button>
        </div>
        <div id="store-buttons" class="stores hidden" aria-label="アプリストア">
          <a id="ios-store-btn" class="button store" href="https://apps.apple.com/jp/app/playnavi/id6756201875">App Storeで入手</a>
          <a id="android-store-btn" class="button store" href="https://play.google.com/store/apps/details?id=com.playnavilab.playnavi.app">Google Playで入手</a>
        </div>
      </section>
    </main>
  </body>
</html>
